# status-monitor (LDS-ADSU/status-monitor) — статус-страница поверх Prometheus.
: "${SERVICE_UNIT:=status-monitor}"
: "${DEPLOY_DIR:=/opt/backend/status-monitor}"
: "${JAR_NAME:=monitor.jar}"

: "${APP_PORT_BLUE:=8410}"
: "${APP_PORT_GREEN:=8420}"

# ОТДЕЛЬНОГО management-порта нет: Actuator живёт на порту приложения. MGMT_PORT_* намеренно
# не заданы — lib.sh подставит APP_PORT_*. Это и есть вырожденный профиль, ради которого
# фолбэк вообще появился.

: "${HEALTH_TIMEOUT:=120}"
: "${SMOKE_PATH:=}"
