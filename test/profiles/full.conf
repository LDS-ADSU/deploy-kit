# Shape: separate management ports, a smoke endpoint accepting SEVERAL codes.
# Real counterpart: adsu-team.
#
# Fixtures are synthetic on purpose. The harness verifies the SHAPE of a profile — which fields
# are present, how they combine — and none of the assertions depend on a real port number, so
# putting production topology in a public repository would buy nothing.
: "${SERVICE_UNIT:=svc-full}"
: "${DEPLOY_DIR:=/opt/backend/svc-full}"
: "${JAR_NAME:=svc-full.jar}"
: "${APP_PORT_BLUE:=8100}"
: "${APP_PORT_GREEN:=8200}"
: "${MGMT_PORT_BLUE:=8101}"
: "${MGMT_PORT_GREEN:=8201}"
: "${HEALTH_TIMEOUT:=600}"
: "${SMOKE_PATH:=/v1/full/local/probe}"
: "${SMOKE_EXPECT:=200 407}"
