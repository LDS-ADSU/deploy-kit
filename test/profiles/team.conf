# adsu-team — the reference profile. Every one of the harness's 57 assertions was written
# against these values, so this file is also the fixture that proves the generalisation left
# behaviour untouched.
#
# The `: "${KEY:=value}"` form matters: it assigns only when the variable is unset, so the
# environment always wins. That is what lets deploy.yml keep passing DEPLOY_DIR and the
# harness keep pointing everything at a temporary directory.
: "${SERVICE_UNIT:=adsu-team}"
: "${DEPLOY_DIR:=/opt/backend/adsu-team}"
: "${JAR_NAME:=team.jar}"

: "${APP_PORT_BLUE:=2333}"
: "${APP_PORT_GREEN:=2343}"
: "${MGMT_PORT_BLUE:=2334}"
: "${MGMT_PORT_GREEN:=2344}"

# Boot + Liquibase + the studlife pool take their time; HEALTH_TIMEOUT bounds the readiness wait.
: "${HEALTH_TIMEOUT:=600}"

# 407 is LocalNetworkWebFilter's normal answer to a request from 127.0.0.1 (loopback is not in
# security.allowed-networks); 200 means it was added there. Either proves the app answers on the
# real application port with the real base-path.
: "${SMOKE_PATH:=/v1/team/local/probe}"
: "${SMOKE_EXPECT:=200 407}"
