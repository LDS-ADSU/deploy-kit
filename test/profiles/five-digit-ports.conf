# Shape: FIVE-digit ports and a hyphen-and-dot heavy jar name. No real service looks like this
# today, which is exactly why the fixture exists: every production profile is four-digit, so the
# 2-5 digit width in detect_active would otherwise be asserted by nothing, and a service that
# later picks a high port would fail with "cannot determine the active colour" on a healthy host.
: "${SERVICE_UNIT:=svc-core-backend}"
: "${DEPLOY_DIR:=/opt/backend/svc-core-backend}"
: "${JAR_NAME:=svc-core-backend.jar}"
: "${APP_PORT_BLUE:=34100}"
: "${APP_PORT_GREEN:=34200}"
: "${MGMT_PORT_BLUE:=34101}"
: "${MGMT_PORT_GREEN:=34201}"
: "${HEALTH_TIMEOUT:=300}"
: "${SMOKE_PATH:=}"
