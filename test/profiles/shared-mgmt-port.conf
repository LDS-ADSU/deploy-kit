# Shape: NO separate management port — Actuator answers on the application port, so MGMT_PORT_* is
# omitted entirely and lib.sh must fall back to APP_PORT_*. This is the degenerate profile the
# fallback exists for; without it the profile could not be written down at all.
# Real counterpart: status-monitor.
: "${SERVICE_UNIT:=svc-shared-port}"
: "${DEPLOY_DIR:=/opt/backend/svc-shared-port}"
: "${JAR_NAME:=svc-shared-port.jar}"
: "${APP_PORT_BLUE:=7100}"
: "${APP_PORT_GREEN:=7200}"
: "${HEALTH_TIMEOUT:=120}"
: "${SMOKE_PATH:=}"
