# Shape: a smoke endpoint accepting exactly ONE code. Guards the list-parsing in deploy.sh, which
# a single multi-code fixture would leave half-covered: a naive `case 200|407` would pass the
# multi-code profile and quietly accept the wrong code here.
: "${SERVICE_UNIT:=svc-single}"
: "${DEPLOY_DIR:=/opt/backend/svc-single}"
: "${JAR_NAME:=svc-single.jar}"
: "${APP_PORT_BLUE:=8300}"
: "${APP_PORT_GREEN:=8400}"
: "${MGMT_PORT_BLUE:=8301}"
: "${MGMT_PORT_GREEN:=8401}"
: "${HEALTH_TIMEOUT:=120}"
: "${SMOKE_PATH:=/health/probe}"
: "${SMOKE_EXPECT:=200}"
