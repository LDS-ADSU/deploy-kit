# adsu-sso (grahov/adsu-auth-service) — OAuth2/OIDC, AD/LDAP, антифрод.
: "${SERVICE_UNIT:=adsu-sso}"
: "${DEPLOY_DIR:=/opt/backend/adsu-sso}"
: "${JAR_NAME:=sso.jar}"

: "${APP_PORT_BLUE:=9000}"
: "${APP_PORT_GREEN:=9010}"
: "${MGMT_PORT_BLUE:=9001}"
: "${MGMT_PORT_GREEN:=9011}"

# Прежний deploy.sh давал 60 попыток × 2с. Бюджет сохранён намеренно: гейт при этом стал
# мягче, а не жёстче — readiness поднимается раньше агрегата /actuator/health, в который
# входили LDAP и diskSpace.
: "${HEALTH_TIMEOUT:=120}"

# Пробы на app-порту нет. Смоук пропускается явным сообщением; завести дешёвый эндпоинт —
# отдельная задача на сервис.
: "${SMOKE_PATH:=}"
