: "${DEPLOY_DIR:=/opt/backend/svc-nosmoke}"
: "${JAR_NAME:=svc-nosmoke.jar}"
: "${APP_PORT_BLUE:=9100}"
: "${APP_PORT_GREEN:=9200}"
: "${MGMT_PORT_BLUE:=9101}"
: "${MGMT_PORT_GREEN:=9201}"
: "${HEALTH_TIMEOUT:=180}"
: "${SMOKE_PATH:=}"
